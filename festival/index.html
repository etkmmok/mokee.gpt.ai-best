<style>
/* Layout: a fixed 1086×1448 stage (the poster's own size) scaled to fit the screen; the poster is assembled layer by layer on one GSAP timeline. */
:root{--page:#173B2A;--navy:#1F5A3C;--sun:#FFD25E;--red:#E8622C;--blue:#E8622C;--ink:#1B2240;--muted:#53607E;
  --display:'Black Han Sans','Noto Sans KR',sans-serif;--body:'Noto Sans KR','Malgun Gothic',sans-serif;--s:1;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:#fff;font-family:var(--body);overflow:hidden;margin:0}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:1086px;height:1448px;flex-shrink:0;transform:scale(var(--s));transform-origin:center center;overflow:hidden;background:#FBF6EA;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.stage img{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.ov,.base{opacity:0}
.band{position:absolute;left:-10%;width:120%;height:300px;top:560px;display:flex;align-items:center;justify-content:center;z-index:20;transform:skewY(-6deg);visibility:hidden}
.band.b1{background:var(--navy)}
.band.b2{background:var(--blue)}
.band .txt{transform:skewY(6deg);font-family:var(--display);font-size:104px;line-height:1;color:#fff;white-space:nowrap;letter-spacing:-.01em;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.band .txt em{font-style:normal;color:var(--sun)}
.band .sub{position:absolute;bottom:30px;left:0;right:0;text-align:center;transform:skewY(6deg);font-weight:900;font-size:34px;color:#DCE6FF}
.ch{display:inline-block;will-change:transform}
.sticker{position:absolute;left:524px;top:290px;z-index:15;width:134px;height:134px;border-width:6px;border-radius:50%;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border:7px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:0}
.sticker small{font-weight:900;font-size:20px}
.sticker b{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.conf{position:absolute;z-index:25;width:12px;height:20px;border-radius:3px;opacity:0;left:0;top:0}
.shine{position:absolute;top:-20%;left:0;width:220px;height:140%;z-index:24;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.65),rgba(255,255,255,0));transform:translateX(-400px) rotate(18deg);pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;z-index:26;opacity:0;pointer-events:none}

/* controls */
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:30;display:flex;gap:8px;background:rgba(23,59,42,.88);backdrop-filter:blur(6px);padding:6px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.cb{min-height:44px;min-width:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#fff;font:inherit;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.cb:hover{background:rgba(255,255,255,.12)}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.3);padding-block:16px calc(16px + env(safe-area-inset-bottom, 0px));max-height:80vh;overflow:auto;font-size:16px}
.pw{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lab{width:88px;font-weight:700;font-size:14px}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1.5px solid #D5DCEB;background:#F5F7FB;color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.inp{flex:1;min-width:0;min-height:44px;border:1.5px solid #D5DCEB;border-radius:12px;padding:0 12px;font:inherit;font-size:15px}
input[type=color]{width:48px;height:44px;border:1.5px solid #D5DCEB;border-radius:12px;padding:3px;background:#fff}
.hint{font-size:13px;color:var(--muted);margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.render .bar,.render .panel{display:none!important}
html:not(.teacher) .bar,html:not(.teacher) .panel{display:none!important}
.cb{white-space:nowrap}
</style>

  /* text helpers: split headline into letters, last word highlighted */
  function setBand(el,sub,text,subText){

    var max=1000; el.style.fontSize=''; var fs=104; el.style.fontSize=fs+'px';

  }

  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}

    /* 1 — opening: gym scene opens like an iris with a slow push-in */
    tl.fromTo('#flash',{opacity:.9},{opacity:0,duration:.6,ease:'power2.out'},0)
      .fromTo('#b-hero',{opacity:1,clipPath:'circle(0% at 72% 40%)',scale:1.14,transformOrigin:'72% 40%'},{clipPath:'circle(140% at 72% 40%)',duration:1.2,ease:'power3.inOut'},0.1)
      .to('#b-hero',{scale:1,duration:3.2,ease:'power2.out'},0.1)
      .fromTo('#o-title',{opacity:0,scale:.3,rotation:-8,transformOrigin:'40% 60%'},{opacity:1,scale:1,rotation:0,duration:1,ease:'back.out(1.9)'},0.7)
      .fromTo('#o-ribbon',{opacity:1,clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.6,ease:'power3.inOut'},1.35)
      .fromTo('#o-hand',{opacity:1,clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1.1,ease:'none'},1.8);
    confA.forEach(function(c){var ang=rnd()*Math.PI*2,dist=180+rnd()*420,x0=300,y0=170;
      tl.fromTo(c,{x:x0,y:y0,opacity:1,rotation:0,scale:.6+rnd()*.8},{x:x0+Math.cos(ang)*dist,y:y0+Math.sin(ang)*dist*0.7+260,rotation:rnd()*720-360,opacity:0,duration:1.6+rnd()*.6,ease:'power3.out'},0.75+rnd()*.15);});
    tl.fromTo('#sticker',{opacity:0,scale:0,rotation:-40},{opacity:1,scale:1,rotation:-10,duration:.7,ease:'back.out(2.4)'},2.4);
    if(dday>0)tl.to(num,{v:dday,duration:1.1,ease:'power2.inOut',onUpdate:function(){$('#stNum').textContent='D-'+Math.round(num.v);}},2.6);
    tl.fromTo('#b-info',{opacity:0,y:-70},{opacity:1,y:0,duration:.6,ease:'power3.out'},2.9);

    /* 2 — interlude: expert */
    tl.set('#band1',{visibility:'visible'},3.7)
      .fromTo('#band1',{xPercent:-105},{xPercent:0,duration:.5,ease:'power4.out'},3.7)
      .fromTo('#band1 .ch',{y:120,opacity:0,rotation:8},{y:0,opacity:1,rotation:0,duration:.5,stagger:.035,ease:'back.out(2)'},3.95)
      .fromTo('#s1',{opacity:0,y:20},{opacity:1,y:0,duration:.4},4.35)
      .to('#band1',{xPercent:105,duration:.5,ease:'power4.in'},5.45)
      .set('#band1',{visibility:'hidden'},6.0);

    /* 3 — expert: MC and sound engineer slide in from both sides */
    tl.fromTo('#b-expert',{opacity:1,clipPath:'inset(0 50% 0 50%)'},{clipPath:'inset(0 0% 0 0%)',duration:.6,ease:'power3.inOut'},5.8)
      .fromTo('#o-mc',{opacity:0,x:-260},{opacity:1,x:0,duration:.7,ease:'back.out(1.4)'},6.05)
      .fromTo('#o-eng',{opacity:0,x:260},{opacity:1,x:0,duration:.7,ease:'back.out(1.4)'},6.15)
      .fromTo('#o-ex-title',{opacity:0,y:30,scale:.9},{opacity:1,y:0,scale:1,duration:.5,ease:'back.out(2)'},6.35)
      .fromTo('#o-ex-desc',{opacity:0,y:20},{opacity:1,y:0,duration:.45,ease:'power3.out'},6.6)
      .fromTo('.g-ck',{opacity:0,x:-120},{opacity:1,x:0,duration:.45,stagger:.18,ease:'power3.out'},6.85);

    /* 4 — schedule cards drop in */
    tl.fromTo('#b-time',{opacity:0},{opacity:1,duration:.4},7.6)
      .fromTo('#o-t-head',{opacity:0,x:-140},{opacity:1,x:0,duration:.5,ease:'power3.out'},7.65)
      .fromTo('.g-tc',{opacity:0,y:-260,rotation:function(i){return [-8,6,-5][i]}},{opacity:1,y:0,rotation:0,duration:.9,stagger:.2,ease:'bounce.out'},7.95)
      .fromTo('#o-t-note',{opacity:0,y:30},{opacity:1,y:0,duration:.5,ease:'power3.out'},9.0);

    /* 5 — activities pop along the bar */
    tl.fromTo('#b-act',{opacity:0},{opacity:1,duration:.4},9.6)
      .fromTo('#o-a-head',{opacity:0,x:-140},{opacity:1,x:0,duration:.5,ease:'power3.out'},9.65)
      .fromTo('.g-ac',{opacity:0,y:30,scale:.6},{opacity:1,y:0,scale:1,duration:.5,stagger:.15,ease:'back.out(2.4)'},9.95)
      .fromTo('#o-a-note',{opacity:0},{opacity:1,duration:.4},10.7);

    /* 6 — interlude: safety */
    tl.set('#band2',{visibility:'visible'},11.2)
      .fromTo('#band2',{xPercent:105},{xPercent:0,duration:.5,ease:'power4.out'},11.2)
      .fromTo('#band2 .ch',{scale:0,opacity:0},{scale:1,opacity:1,duration:.45,stagger:.04,ease:'back.out(3)'},11.45)
      .fromTo('#s2',{opacity:0,y:20},{opacity:1,y:0,duration:.4},11.85)
      .to('#band2',{xPercent:-105,duration:.5,ease:'power4.in'},12.95)
      .set('#band2',{visibility:'hidden'},13.5);

    /* 7 — safety items pop */
    tl.fromTo('#b-safe',{opacity:1,clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)',duration:.6,ease:'power3.inOut'},13.3)
      .fromTo('#o-s-head',{opacity:0,x:-300},{opacity:1,x:0,duration:.6,ease:'back.out(1.4)'},13.55)
      .fromTo('.g-sf',{opacity:0,scale:.2},{opacity:1,scale:1,duration:.5,stagger:.13,ease:'back.out(2.2)'},13.9)
      .fromTo('#b-foot',{opacity:0,y:110},{opacity:1,y:0,duration:.7,ease:'power3.out'},14.8)
      .fromTo('#o-f-text',{opacity:1,clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1.1,ease:'none'},15.2);

    /* 8 — finale: swap in the seamless full poster, then shine */
    tl.to('#full',{opacity:1,duration:.4,ease:'none'},16.2);
    tl.fromTo('#shine',{x:-400},{x:1500,duration:1.1,ease:'power2.inOut'},16.4)
            .to('#sticker',{rotation:6,duration:.25,yoyo:true,repeat:3,ease:'sine.inOut'},16.7);
    confB.forEach(function(c){var x=rnd()*1086;tl.fromTo(c,{x:x,y:-60-rnd()*200,opacity:1,rotation:rnd()*360},{y:1500,x:x+(rnd()*240-120),rotation:'+='+(360+rnd()*540),opacity:1,duration:2.6+rnd()*1.4,ease:'none'},16.5+rnd()*.9);});
    tl.to({},{duration:1.2});
    tl.eventCallback('onComplete',function(){if(RENDER||!st.loop)return;gsap.delayedCall(2.5/st.sp,function(){if(st.loop)restart();});});
    tl.timeScale(st.sp);
    window.__TL=tl;
  }
  function restart(){build();tl.play(0);setPlay(true);}
  var playing=true;
  function setPlay(p){playing=p;$('#play').setAttribute('aria-label',p?'일시정지':'재생');
    $('#playIco').innerHTML=p?'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>':'<path d="M7 4l13 8-13 8z"/>';}
  $('#play').addEventListener('click',function(){if(!tl)return;if(tl.progress()===1){restart();return;}if(playing){tl.pause();setPlay(false);}else{tl.play();setPlay(true);}});
  $('#again').addEventListener('click',restart);
  var panel=$('#panel');
  function openP(o){panel.hidden=!o;$('#bar').hidden=o;$('#openSet').setAttribute('aria-expanded',String(o));}
  $('#openSet').addEventListener('click',function(){openP(true)});
  $('#close').addEventListener('click',function(){openP(false)});
  function apply(){document.body.style.background=st.bg;document.documentElement.style.setProperty('--page',st.bg);
    $$('[data-sp]').forEach(function(b){b.setAttribute('aria-pressed',String(parseFloat(b.dataset.sp)===st.sp));});
    $('#loopBtn').setAttribute('aria-pressed',String(st.loop));$('#loopBtn').textContent=st.loop?'켜짐':'꺼짐';
    $('#bgc').value=st.bg;$('#in1').value=st.t1;$('#in1s').value=st.s1;$('#in2').value=st.t2;$('#in2s').value=st.s2;
    if(tl)tl.timeScale(st.sp);save(st);}
  $$('[data-sp]').forEach(function(b){b.addEventListener('click',function(){st.sp=parseFloat(b.dataset.sp);apply();});});
  $('#loopBtn').addEventListener('click',function(){st.loop=!st.loop;apply();});
  $('#bgc').addEventListener('input',function(e){st.bg=e.target.value;apply();});
  $('#apply').addEventListener('click',function(){st.t1=$('#in1').value||st.t1;st.s1=$('#in1s').value;st.t2=$('#in2').value||st.t2;st.s2=$('#in2s').value;apply();openP(false);restart();});
  $('#reset').addEventListener('click',function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload();});
  apply();

  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function start(){build();
    if(RENDER){window.__READY=true;return;}
    if(reduce){tl.progress(1);setPlay(false);return;}
    tl.play(0);}
  if(window.gsap){ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(start,250)}); }
  else { $$('.base,.ov').forEach(function(e){e.style.opacity=1}); }
})();
</script>

</body>
</html>
